<div class="nt-segmented" role="group" [attr.aria-label]="i18n.t('currency.label')">
  <svg class="nt-segmented-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9" />
    <path
      d="M14.5 9.2A2.6 2.6 0 0 0 12 7.6c-1.6 0-2.6.9-2.6 2s1 1.7 2.6 2.1 2.7 1 2.7 2.2-1.1 2.1-2.7 2.1a2.7 2.7 0 0 1-2.6-1.7"
    />
    <path d="M12 6v12" />
  </svg>

  @for (option of options; track option.value) {
    <button
      type="button"
      class="nt-segmented-option"
      [class.nt-segmented-option-active]="currencyService.currency() === option.value"
      [attr.aria-pressed]="currencyService.currency() === option.value"
      [attr.aria-label]="i18n.t(option.nameKey)"
      [title]="i18n.t(option.nameKey)"
      (click)="select(option.value)"
    >
      {{ option.code }}
    </button>
  }
</div>
