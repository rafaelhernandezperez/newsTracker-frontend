<div class="lang-switch" role="group" [attr.aria-label]="i18n.t('lang.label')">
  <svg class="lang-switch-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18" />
    <path d="M12 3c2.5 2.4 3.8 5.4 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3z" />
  </svg>

  @for (option of options; track option.value) {
    <button
      type="button"
      class="lang-switch-option"
      [class.lang-switch-option-active]="i18n.language() === option.value"
      [attr.aria-pressed]="i18n.language() === option.value"
      [attr.aria-label]="i18n.t(option.nameKey)"
      [title]="i18n.t(option.nameKey)"
      (click)="select(option.value)"
    >
      {{ option.code }}
    </button>
  }
</div>
